name: gitwarden-t7
services:
  gitea:
    image: docker.gitea.com/gitea:1.27.3
    platform: linux/amd64
    environment:
      TZ: UTC
      GITEA__database__DB_TYPE: sqlite3
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__ROOT_URL: http://127.0.0.1:18300/
      GITEA__server__DISABLE_SSH: "false"
      GITEA__server__SSH_DOMAIN: 127.0.0.1
      GITEA__server__SSH_PORT: "18322"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__migrations__ALLOW_LOCALNETWORKS: "true"
      GITEA__actions__ENABLED: "true"
    ports:
      - "127.0.0.1:18300:3000"
      - "127.0.0.1:18322:22"
    volumes:
      - gitea-data:/data
  forgejo:
    image: codeberg.org/forgejo/forgejo:16.0.5
    platform: linux/amd64
    environment:
      TZ: UTC
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__server__ROOT_URL: http://127.0.0.1:18301/
      FORGEJO__server__DISABLE_SSH: "false"
      FORGEJO__server__SSH_DOMAIN: 127.0.0.1
      FORGEJO__server__SSH_PORT: "18323"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__migrations__ALLOW_LOCALNETWORKS: "true"
      FORGEJO__actions__ENABLED: "true"
    ports:
      - "127.0.0.1:18301:3000"
      - "127.0.0.1:18323:22"
    volumes:
      - forgejo-data:/data
volumes:
  gitea-data:
  forgejo-data:
